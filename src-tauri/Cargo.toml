[package]
name = "wintune"
version = "0.1.0"
description = "WinTune — Otimizador de Serviços do Windows"
authors = ["Contribuidores do WinTune"]
license = "MIT"
repository = "https://github.com/pequenojoohn/wintune"
readme = "../README.md"
keywords = ["windows", "services", "tauri", "optimizer"]
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wintune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# O binário carrega o manifest requireAdministrator, então seu executável de teste
# não rodaria em terminal comum (erro 740). Todos os testes ficam na lib.
[[bin]]
name = "wintune"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
windows-service = "0.8.1"
sysinfo = "0.40.3"
chrono = { version = "0.4.45", features = ["serde"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Services", "Win32_Security", "Win32_System_Threading"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
